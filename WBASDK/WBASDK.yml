attributes:
  BuildIndependentTargetsInParallel: '1'
  LastSwiftUpdateCheck: '1500'
  LastUpgradeCheck: '1500'
  ORGANIZATIONNAME: WBA

name: WBASDK
options:
  defaultConfig: Release
  groupSortPosition: top
  transitivelyLinkDependencies: false

packages:
  WBASDK:
    path: ..

schemes:
  WBASDK:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        WBASDK:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      config: Debug

  WBASDKTestApp:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        WBASDKTestApp:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      config: Debug

  WBASDKTestApp_tvOS:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        WBASDKTestApp_tvOS:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      config: Debug

  WBASDKTests:
      analyze:
        config: Debug
      archive:
        config: Release
      build:
        targets:
          WBASDKTests:
          - running
          - testing
      test:
        targets:
          - WBASDKTests
      profile:
        config: Release
      run:
        config: Debug

  WBASDKTests_tvOS:
      analyze:
        config: Debug
      archive:
        config: Release
      build:
        targets:
          WBASDKTests_tvOS:
          - running
          - testing
      test:
        targets:
          - WBASDKTests_tvOS
      profile:
        config: Release
      run:
        config: Debug


settings:
  configs:
    Debug:
      CLANG_CXX_LANGUAGE_STANDARD: gnu++17
      CURRENT_PROJECT_VERSION: '1'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      MTL_FAST_MATH: 'YES'
      SDKROOT: iphoneos
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      VERSIONING_SYSTEM: apple-generic
      VERSION_INFO_PREFIX: ''
    Release:
      CLANG_CXX_LANGUAGE_STANDARD: gnu++17
      CURRENT_PROJECT_VERSION: '1'
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
      MTL_FAST_MATH: 'YES'
      SDKROOT: iphoneos
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VERSIONING_SYSTEM: apple-generic
      VERSION_INFO_PREFIX: ''

configs:
  Debug: debug
  Release: release

targets:
  WBASDK:
    postCompileScripts:
        - script: |
            if [[ "$(uname -m)" == arm64 ]]; then
                export PATH="/opt/homebrew/bin:$PATH"
            fi

            if which swiftlint > /dev/null; then
                swiftlint
            else
                brew install swiftlint
            fi
          name: Swiftlint
          basedOnDependencyAnalysis: false
    productName: WBASDK
    platform: iOS
    settings:
      base:
        PRODUCT_MODULE_NAME: WBASDK
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 4Y4A396ZEB
          GENERATE_INFOPLIST_FILE: 'YES'
          INFOPLIST_KEY_NSHumanReadableCopyright: ''
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
          MARKETING_VERSION: '0.0.1'
          PRODUCT_BUNDLE_IDENTIFIER: COM.WBA.MOBILEAPP.WBASDK.WBASDK
          SWIFT_EMIT_LOC_STRINGS: 'YES'
          SWIFT_VERSION: '5.0'
        Release:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 4Y4A396ZEB
          GENERATE_INFOPLIST_FILE: 'YES'
          INFOPLIST_KEY_NSHumanReadableCopyright: ''
          IPHONEOS_DEPLOYMENT_TARGET: '15.0'
          MARKETING_VERSION: '0.0.1'
          PRODUCT_BUNDLE_IDENTIFIER: COM.WBA.MOBILEAPP.WBASDK.WBASDK
          SWIFT_EMIT_LOC_STRINGS: 'YES'
          SWIFT_VERSION: '5.0'
    sources:
    - name: WBASDK
      path: WBASDK
    type: framework

  WBASDKTests:
    dependencies:
    - target: WBASDK
    platform: iOS
    sources:
    - name: WBASDKTests
      path: WBASDKTests
    type: bundle.unit-test

  WBASDKTests_tvOS:
    dependencies:
    - package: WBASDK
      product: WBASDK
    platform: tvOS
    sources:
    - name: WBASDKTests
      path: WBASDKTests
    type: bundle.unit-test

  
    
  WBASDKTestApp:
    dependencies:
    - target: WBASDK
    platform: iOS
    settings:
      configs:
        Debug:
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: 'YES'
          CODE_SIGN_STYLE: Automatic
          CURRENT_PROJECT_VERSION: '1'
          DEVELOPMENT_TEAM: 4Y4A396ZEB
          GENERATE_INFOPLIST_FILE: 'YES'
          MARKETING_VERSION: '0.0.1'
          PRODUCT_BUNDLE_IDENTIFIER: COM.WBA.MOBILEAPP.WBASDK.WBASDKTestApp
          INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
          SWIFT_EMIT_LOC_STRINGS: 'NO'
          SWIFT_VERSION: '5.0'
        Release:
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: 'YES'
          CODE_SIGN_STYLE: Automatic
          CURRENT_PROJECT_VERSION: '1'
          DEVELOPMENT_TEAM: 4Y4A396ZEB
          GENERATE_INFOPLIST_FILE: 'YES'
          MARKETING_VERSION: '0.0.1'
          PRODUCT_BUNDLE_IDENTIFIER: COM.WBA.MOBILEAPP.WBASDK.WBASDKTestApp
          INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
          SWIFT_EMIT_LOC_STRINGS: 'NO'
          SWIFT_VERSION: '5.0'
    sources:
    - name: WBASDKTestApp
      path: WBASDKTestApp
    type: application

  WBASDKTestApp_tvOS:
    dependencies:
    - package: WBASDK
      product: WBASDK
    platform: tvOS
    settings:
      configs:
        Debug:
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: 'YES'
          CODE_SIGN_STYLE: Automatic
          CURRENT_PROJECT_VERSION: '1'
          DEVELOPMENT_TEAM: 4Y4A396ZEB
          GENERATE_INFOPLIST_FILE: 'YES'
          MARKETING_VERSION: '0.0.1'
          PRODUCT_BUNDLE_IDENTIFIER: COM.WBA.MOBILEAPP.WBASDK.WBASDKTestAppTV
          SWIFT_EMIT_LOC_STRINGS: 'NO'
          SWIFT_VERSION: '5.0'
          TVOS_DEPLOYMENT_TARGET: '15.0'
          SDKROOT: appletvos
          INFOPLIST_KEY_UILaunchStoryboardName: ''
        Release:
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: 'YES'
          CODE_SIGN_STYLE: Automatic
          CURRENT_PROJECT_VERSION: '1'
          DEVELOPMENT_TEAM: 4Y4A396ZEB
          GENERATE_INFOPLIST_FILE: 'YES'
          MARKETING_VERSION: '0.0.1'
          PRODUCT_BUNDLE_IDENTIFIER: COM.WBA.MOBILEAPP.WBASDK.WBASDKTestAppTV
          SWIFT_EMIT_LOC_STRINGS: 'NO'
          SWIFT_VERSION: '5.0'
          TVOS_DEPLOYMENT_TARGET: '15.0'
          SDKROOT: appletvos
          INFOPLIST_KEY_UILaunchStoryboardName: ''
    sources:
    - name: WBASDKTestApp
      path: WBASDKTestApp
      excludes:
      - Base.lproj/**
    type: application
